<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaski Delivery - Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Chaski Delivery - Factura</a>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 600px;">
        <div id="contenedor-factura" class="card shadow-sm">
            <div class="card-body text-center text-muted py-5">
                Cargando factura...
            </div>
        </div>

        <div class="text-center mt-3 no-print">
            <button class="btn btn-outline-primary" onclick="window.print()">Imprimir / Guardar PDF</button>
            <a href="/cliente/panel" class="btn btn-outline-secondary">Volver a mi panel</a>
        </div>
    </div>

    <script>
        const idPedido = {{ id_pedido }};

        async function cargarFactura() {
            const contenedor = document.getElementById('contenedor-factura');
            try {
                const res = await fetch(`/api/factura/${idPedido}`);

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    contenedor.innerHTML = `
                        <div class="card-body text-center text-danger py-5">
                            ${data.error || 'No se pudo cargar la factura.'}
                        </div>`;
                    return;
                }

                const f = await res.json();
                const fecha = f.fecha ? new Date(f.fecha).toLocaleString() : 'N/A';

                contenedor.innerHTML = `
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h3 class="mb-0">Chaski Delivery</h3>
                            <small class="text-muted">Factura Electrónica</small>
                        </div>
                        <hr>
                        <div class="row mb-2">
                            <div class="col-6"><strong>N° Factura:</strong></div>
                            <div class="col-6 text-end">${f.id_factura}</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>NIT:</strong></div>
                            <div class="col-6 text-end">${f.nit}</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>N° Autorización:</strong></div>
                            <div class="col-6 text-end">${f.nro_autorizacion}</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>Fecha de Emisión:</strong></div>
                            <div class="col-6 text-end">${fecha}</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>Tipo de Pago:</strong></div>
                            <div class="col-6 text-end">${f.tipo_pago}</div>
                        </div>
                        <hr>
                        <div class="row mb-2">
                            <div class="col-6"><strong>Cliente:</strong></div>
                            <div class="col-6 text-end">${f.cliente}</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>Correo:</strong></div>
                            <div class="col-6 text-end">${f.correo}</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6"><strong>Dirección:</strong></div>
                            <div class="col-6 text-end">${f.direccion || 'N/A'}</div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-6"><h5>Total:</h5></div>
                            <div class="col-6 text-end"><h5>Bs. ${parseFloat(f.total).toFixed(2)}</h5></div>
                        </div>
                    </div>`;
            } catch (e) {
                contenedor.innerHTML = `
                    <div class="card-body text-center text-danger py-5">
                        Ocurrió un error al conectar con el servidor.
                    </div>`;
            }
        }

        cargarFactura();
    </script>
</body>
</html>
