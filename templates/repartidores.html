<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaski Delivery - Seleccionar Repartidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Confirmar Pedido y Seleccionar Repartidor</h2>
            <a href="/cliente/panel" class="btn btn-secondary">Volver al Panel</a>
        </div>

        <div class="row">
            <!-- Resumen del Pedido -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Resumen de tu Pedido</h5>
                    </div>
                    <div class="card-body">
                        <div id="resumen-productos">
                            <p class="text-muted">Cargando detalles...</p>
                        </div>
                        <hr>
                        <h4 class="text-end text-success">Total: <span id="total-pagar">Bs. 0.00</span></h4>
                    </div>
                </div>
            </div>

            <!-- Lista de Repartidores -->
            <div class="col-md-8">
                <h4 class="mb-3">Repartidores Disponibles</h4>
                <div id="contenedor-repartidores" class="row">
                    <div class="text-center">Cargando repartidores...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert("No hay sesión activa. Por favor, inicia sesión.");
            window.location.href = '/';
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const pedidoTemporal = JSON.parse(localStorage.getItem('pedido_temporal'));

            if (!pedidoTemporal) {
                alert("No se encontró un pedido en proceso.");
                window.location.href = '/cliente/panel';
                return;
            }

            // Mostrar resumen
            const resumenDiv = document.getElementById('resumen-productos');
            resumenDiv.innerHTML = '';
            pedidoTemporal.detalles.forEach(item => {
                resumenDiv.innerHTML += `
                    <div class="d-flex justify-content-between mb-2">
                        <span>Prod. ID: ${item.id_producto} (Cant: <strong>${item.cantidad}</strong>)</span>
                        <span>Bs. ${(item.precio * item.cantidad).toFixed(2)}</span>
                    </div>
                `;
            });
            document.getElementById('total-pagar').textContent = `Bs. ${pedidoTemporal.total.toFixed(2)}`;

            // Cargar repartidores
            try {
                const res = await fetch('http://127.0.0.1:5000/api/repartidores/disponibles', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const repartidores = await res.json();
                    const contenedor = document.getElementById('contenedor-repartidores');
                    contenedor.innerHTML = '';

                    if (repartidores.length === 0) {
                        contenedor.innerHTML = '<div class="alert alert-warning">No hay repartidores disponibles en este momento.</div>';
                        return;
                    }

                    repartidores.forEach(rep => {
                        contenedor.innerHTML += `
                            <div class="col-md-6 mb-3">
                                <div class="card shadow-sm h-100">
                                    <div class="card-body d-flex flex-column justify-content-between">
                                        <div>
                                            <h5 class="card-title">${rep.nombre} ${rep.apepaterno}</h5>
                                            <p class="card-text mb-1"><strong>Celular:</strong> ${rep.telefono || 'No registrado'}</p>
                                        </div>
                                        <button class="btn btn-success w-100 mt-3" onclick="seleccionarRepartidor('${rep.ci_repartidor}')">
                                            Elegir este Repartidor
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    console.error("Error al obtener repartidores");
                }
            } catch (error) {
                console.error("Error de red:", error);
            }
        });

        async function seleccionarRepartidor(ciRepartidor) {
            const pedidoTemporal = JSON.parse(localStorage.getItem('pedido_temporal'));
            pedidoTemporal.ci_repartidor = ciRepartidor;

            try {
                const res = await fetch('http://127.0.0.1:5000/api/pedido/crear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(pedidoTemporal)
                });

                const data = await res.json();

                if (res.ok) {
                    alert(`¡Pedido creado con éxito! ID Asignado: ${data.id_pedido}`);
                    localStorage.removeItem('pedido_temporal');
                    window.location.href = '/cliente/panel';
                } else {
                    alert(data.error || "Error al crear el pedido");
                }
            } catch (error) {
                alert("Ocurrió un error al procesar el pedido.");
            }
        }
    </script>
</body>
</html>
