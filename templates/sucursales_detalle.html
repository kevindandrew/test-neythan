<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle por Sucursal - Chaski</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Desglose Detallado por Sucursal</h2>
            <div>
                <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#modalNuevaSucursal">+ Registrar Nueva Sucursal</button>
                <a href="/dashboard" class="btn btn-secondary">Volver al Panel Principal</a>
            </div>
        </div>

        <div id="contenedor-sucursales">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Cargando información detallada...</p>
            </div>
        </div>
    </div>

    <!-- Modal para Registrar Sucursal -->
    <div class="modal fade" id="modalNuevaSucursal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Registrar Nueva Sucursal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevaSucursal">
                        <div class="mb-3">
                            <label class="form-label">Nombre de la Sucursal</label>
                            <input type="text" id="nombreSucursal" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" id="direccionSucursal" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Sucursal</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');

        if (!token) {
            alert("No se encontró una sesión activa. Por favor inicie sesión de nuevo.");
            window.location.href = '/';
        }

        async function cargarSucursales() {
            const contenedor = document.getElementById('contenedor-sucursales');
            try {
                const response = await fetch('/api/negocio/detalle-sucursales', {
                    method: 'GET',
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

                const datos = await response.json();
                contenedor.innerHTML = '';

                if (!Array.isArray(datos) || datos.length === 0) {
                    contenedor.innerHTML = '<div class="alert alert-warning">No hay sucursales registradas.</div>';
                    return;
                }

                datos.forEach(item => {
                    const suc = item.sucursal || {};
                    const productos = item.productos || [];
                    const pedidos = item.pedidos || [];
                    const ganancias = item.ganancias || 0;

                    let htmlProductos = productos.length > 0 ? 
                        productos.map(p => `<tr><td>${p.nombre || ''}</td><td>${p.descripcion || '-'}</td><td>Bs ${p.precio_unitario || 0}</td><td>${p.stock_producto || 0}</td></tr>`).join('') :
                        `<tr><td colspan="4" class="text-muted text-center">No hay productos registrados.</td></tr>`;

                    let htmlPedidos = pedidos.length > 0 ?
                        pedidos.map(pe => `<tr><td>#${pe.id_pedido || ''}</td><td>${pe.fecha || 'N/D'}</td><td><span class="badge bg-info">${pe.estado || 'N/D'}</span></td><td>Bs ${pe.total || 0}</td></tr>`).join('') :
                        `<tr><td colspan="4" class="text-muted text-center">No hay pedidos registrados.</td></tr>`;

                    const htmlSucursal = `
                        <div class="card shadow-sm mb-5">
                            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                                <h4 class="mb-0">${suc.nombre || 'Sucursal'}</h4>
                                <div>
                                    <span class="fs-5 text-warning fw-bold me-3">Ganancias: Bs ${parseFloat(ganancias).toFixed(2)}</span>
                                    <button class="btn btn-danger btn-sm" onclick="eliminarSucursal(${suc.id_sucursal})">Eliminar Sucursal</button>
                                </div>
                            </div>
                            <div class="card-body">
                                <p class="text-muted mb-3"><strong>Dirección:</strong> ${suc.direccion || 'No especificada'}</p>
                                
                                <h5 class="text-primary mt-4">Productos en esta Sucursal</h5>
                                <div class="table-responsive mb-4">
                                    <table class="table table-sm table-bordered">
                                        <thead class="table-light"><tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th></tr></thead>
                                        <tbody>${htmlProductos}</tbody>
                                    </table>
                                </div>

                                <h5 class="text-success mt-4">Historial de Pedidos</h5>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered">
                                        <thead class="table-light"><tr><th>ID Pedido</th><th>Fecha</th><th>Estado</th><th>Total</th></tr></thead>
                                        <tbody>${htmlPedidos}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += htmlSucursal;
                });
            } catch (error) {
                contenedor.innerHTML = `<div class="alert alert-danger">Error al cargar datos: ${error.message}</div>`;
            }
        }

        async function eliminarSucursal(id) {
            if (!confirm("¿Estás seguro de eliminar esta sucursal? Se perderá la vinculación de sus productos.")) return;

            try {
                const res = await fetch(`/api/negocio/sucursal/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Sucursal eliminada con éxito");
                    location.reload();
                } else {
                    alert(data.error || "Error al eliminar la sucursal");
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión al servidor");
            }
        }

        document.getElementById('formNuevaSucursal').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreSucursal').value;
            const direccion = document.getElementById('direccionSucursal').value;

            try {
                const res = await fetch('/api/negocio/sucursal', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nombre, direccion })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("¡Sucursal registrada con éxito!");
                    location.reload();
                } else {
                    alert(data.error || "Error al registrar la sucursal");
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión al servidor");
            }
        });

        document.addEventListener("DOMContentLoaded", cargarSucursales);
    </script>
</body>
</html>
